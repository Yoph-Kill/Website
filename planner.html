<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yoph Planner</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/planner.css">
<link rel="stylesheet" href="assets/css/yoph.css">
    <script src="assets/js/yoph.js" defer></script>
</head>
<body class="w-screen h-screen relative bg-white text-slate-800">

    <!-- Top Navigation Bar (Flat Minimalist Gray Bar) -->
    <header class="absolute top-0 left-0 right-0 z-50 flex flex-wrap items-center justify-between gap-4 bg-slate-200 text-slate-800 px-5 py-2.5 border-b border-slate-300">
        <!-- Editable Board Title -->
        <div class="flex items-center gap-2">
            <input id="board-title-input" type="text" value="Untitled Plan" placeholder="Board Title..."
                   class="bg-white border border-slate-300 px-3 py-1.5 text-sm font-semibold text-slate-800 outline-none focus:border-slate-500 w-64 text-left">
        </div>

        <!-- Action Toolbar -->
        <div class="flex items-center gap-2 flex-wrap">
            <button id="btn-new-note" class="flex items-center gap-1.5 bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-3.5 py-1.5 text-sm transition-colors active:bg-emerald-800">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                New Yoph Note
            </button>

            <div class="h-5 w-[1px] bg-slate-300 mx-1"></div>

            <!-- Zoom Controls -->
            <div class="flex items-center bg-white border border-slate-300">
                <button id="btn-zoom-out" title="Zoom Out" class="p-1.5 hover:bg-slate-100 text-slate-700 transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"></path></svg>
                </button>
                <span id="zoom-level" class="px-2.5 text-xs font-semibold text-slate-700 min-w-[50px] text-center">100%</span>
                <button id="btn-zoom-in" title="Zoom In" class="p-1.5 hover:bg-slate-100 text-slate-700 transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                </button>
                <button id="btn-reset-view" title="Reset View" class="px-2.5 py-1.5 text-xs font-medium text-slate-700 hover:bg-slate-100 transition-colors border-l border-slate-300">Reset</button>
            </div>

            <div class="h-5 w-[1px] bg-slate-300 mx-1"></div>

            <!-- Save / Load .yoph -->
            <button id="btn-save" class="flex items-center gap-1.5 bg-slate-100 hover:bg-slate-300 text-slate-800 font-medium px-3.5 py-1.5 border border-slate-300 transition-colors text-sm">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                Save .yoph
            </button>
            <button id="btn-load" class="flex items-center gap-1.5 bg-slate-100 hover:bg-slate-300 text-slate-800 font-medium px-3.5 py-1.5 border border-slate-300 transition-colors text-sm">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                Load .yoph
            </button>
            <input type="file" id="file-input" accept=".yoph" class="hidden">
        </div>
    </header>

    <!-- Canvas Container -->
    <div id="canvas-container" class="w-full h-full canvas-grid relative cursor-grab overflow-hidden">

        <!-- Connections SVG Layer -->
        <svg id="connections-svg" class="absolute inset-0 w-full h-full pointer-events-none z-10 overflow-visible"></svg>

        <!-- World Transformation Container -->
        <div id="world" class="absolute inset-0 origin-top-left pointer-events-none z-20">
            <!-- Dynamic Note Cards are rendered here -->
        </div>
    </div>

    <!-- Overwrite Confirmation Modal -->
    <div id="modal-overwrite" class="fixed inset-0 z-50 hidden bg-slate-900/40 flex items-center justify-center p-4">
        <div class="bg-white border border-slate-300 p-6 w-full max-w-md text-slate-800">
            <h2 class="text-base font-bold text-slate-900 mb-2">Overwrite Current Plan?</h2>
            <p class="text-sm text-slate-600 mb-6">Loading a new .yoph file will replace all current notes and connections on your board. Unsaved changes will be lost.</p>
            <div class="flex items-center justify-end gap-3">
                <button id="btn-cancel-load" class="px-4 py-1.5 bg-slate-200 hover:bg-slate-300 text-slate-800 border border-slate-300 text-sm font-medium transition-colors">Cancel</button>
                <button id="btn-confirm-load" class="px-4 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium transition-colors">Proceed & Load</button>
            </div>
        </div>
    </div>

    <!-- Toast Banner -->
    <div id="toast" class="fixed bottom-4 right-4 z-50 transform translate-y-20 opacity-0 transition-all duration-200 bg-slate-800 text-white px-4 py-2 text-sm flex items-center gap-2">
        <span id="toast-message">Notification</span>
    </div>

    <!-- Application Script -->
    <script src="assets/js/planner.js"></script>
</body>
</html>
