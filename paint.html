<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yoph Paint</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Google Material Symbols Outlined Icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=format_color_fill,colorize,pan_tool,ink_eraser" />
    <link rel="stylesheet" href="assets/css/paint.css">
<link rel="stylesheet" href="assets/css/yoph.css">
    <script src="assets/js/yoph.js" defer></script>
</head>
<body class="w-screen h-screen relative flex flex-col bg-slate-100 text-slate-800">

    <!-- Top Toolbar Row 1: File Actions, Undo/Redo, Zoom, Title -->
    <header class="bg-slate-200 text-slate-800 px-5 py-2 border-b border-slate-300 flex items-center justify-between gap-4 flex-shrink-0 z-40">
        <!-- Artwork Title Input -->
        <div class="flex items-center gap-2">
            <input id="artwork-title-input" type="text" value="Untitled Canvas" placeholder="Canvas Title..."
                class="bg-white border border-slate-300 px-3 h-8 text-xs font-semibold text-slate-800 outline-none focus:border-slate-500 w-56 text-left">
        </div>

        <!-- Action Controls -->
        <div class="flex items-center gap-2">
            <!-- Clear Canvas Button -->
            <button id="btn-clear" title="Clear Canvas" class="flex items-center gap-1 bg-white hover:bg-slate-100 text-slate-700 font-medium px-2.5 h-8 border border-slate-300 text-xs transition-colors">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                Clear
            </button>

            <div class="h-5 w-[1px] bg-slate-300 mx-1"></div>

            <!-- Undo / Redo Buttons -->
            <div class="flex items-center bg-white border border-slate-300 h-8">
                <button id="btn-undo" title="Undo (Ctrl+Z)" class="px-2 h-full hover:bg-slate-100 text-slate-700 transition-colors disabled:opacity-40 disabled:hover:bg-transparent flex items-center justify-center">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"></path></svg>
                </button>
                <div class="h-full w-[1px] bg-slate-300"></div>
                <button id="btn-redo" title="Redo (Ctrl+Y)" class="px-2 h-full hover:bg-slate-100 text-slate-700 transition-colors disabled:opacity-40 disabled:hover:bg-transparent flex items-center justify-center">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 10H11a8 8 0 00-8 8v2m18-10l-6 6m6-6l-6-6"></path></svg>
                </button>
            </div>

            <div class="h-5 w-[1px] bg-slate-300 mx-1"></div>

            <!-- Zoom Controls -->
            <div class="flex items-center bg-white border border-slate-300 h-8">
                <button id="btn-zoom-out" title="Zoom Out" class="px-2 h-full hover:bg-slate-100 text-slate-700 transition-colors flex items-center justify-center">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"></path></svg>
                </button>
                <span id="zoom-level" class="px-2 text-xs font-semibold text-slate-700 min-w-[45px] text-center leading-none">100%</span>
                <button id="btn-zoom-in" title="Zoom In" class="px-2 h-full hover:bg-slate-100 text-slate-700 transition-colors flex items-center justify-center">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                </button>
                <button id="btn-reset-view" title="Reset View" class="px-2 h-full text-xs font-medium text-slate-700 hover:bg-slate-100 transition-colors border-l border-slate-300 flex items-center justify-center">Reset</button>
            </div>

            <div class="h-5 w-[1px] bg-slate-300 mx-1"></div>

            <!-- Load Image -->
            <button id="btn-load-img" class="flex items-center gap-1.5 bg-slate-100 hover:bg-slate-300 text-slate-800 font-medium px-3 h-8 border border-slate-300 transition-colors text-xs">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                Load Image
            </button>
            <input type="file" id="file-input" accept="image/png, image/jpeg, image/jpg" class="hidden">

            <!-- Save Image Dropdown Container -->
            <div class="relative min-w-[140px] flex-shrink-0" id="save-dropdown-container">
                <button id="btn-save" class="w-full flex items-center justify-between gap-1.5 bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-3 h-8 transition-colors text-xs whitespace-nowrap">
                    <div class="flex items-center gap-1.5">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        Save Image
                    </div>
                    <svg class="w-3 h-3 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </button>

                <!-- Save Options Menu (Matches parent width) -->
                <div id="save-menu" class="hidden absolute right-0 top-full mt-1 w-full bg-white border border-slate-300 shadow-md z-50 flex-col">
                    <button id="save-png" class="w-full text-left px-3 py-2 text-xs text-slate-700 hover:bg-slate-100 transition-colors font-medium border-b border-slate-200">
                        PNG Image
                    </button>
                    <button id="save-jpg" class="w-full text-left px-3 py-2 text-xs text-slate-700 hover:bg-slate-100 transition-colors font-medium">
                        JPG Image
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Top Toolbar Row 2: Drawing Tools & Brush Options -->
    <div class="bg-slate-200/80 border-b border-slate-300 px-5 py-1.5 flex flex-wrap items-center justify-between gap-4 flex-shrink-0 z-30">
        
        <!-- Tool Selector (Left Side) -->
        <div class="flex items-center gap-1">
            <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider mr-1">Tools</span>
            <div class="flex items-center bg-white border border-slate-300 p-0.5 h-8">
                <!-- Pan / Hand Tool -->
                <button data-tool="pan" title="Pan / Move Tool" class="btn-tool px-2 h-full text-slate-700 hover:bg-slate-100 transition-colors flex items-center justify-center">
                    <span class="material-symbols-outlined text-lg leading-none">pan_tool</span>
                </button>
                <!-- Brush Button -->
                <button data-tool="brush" title="Pencil / Brush" class="btn-tool active px-2 h-full text-slate-700 hover:bg-slate-100 transition-colors bg-slate-200 flex items-center justify-center">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                </button>
                <!-- Eraser Button -->
                <button data-tool="eraser" title="Eraser" class="btn-tool px-2 h-full text-slate-700 hover:bg-slate-100 transition-colors flex items-center justify-center">
                    <span class="material-symbols-outlined text-lg leading-none">ink_eraser</span>
                </button>
                <!-- Fill Bucket -->
                <button data-tool="bucket" title="Fill Bucket" class="btn-tool px-2 h-full text-slate-700 hover:bg-slate-100 transition-colors flex items-center justify-center">
                    <span class="material-symbols-outlined text-lg leading-none">format_color_fill</span>
                </button>
                <!-- Line Tool -->
                <button data-tool="line" title="Straight Line" class="btn-tool px-2 h-full text-slate-700 hover:bg-slate-100 transition-colors flex items-center justify-center">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 20L20 4"></path></svg>
                </button>
                <!-- Rectangle Tool -->
                <button data-tool="rect" title="Rectangle" class="btn-tool px-2 h-full text-slate-700 hover:bg-slate-100 transition-colors flex items-center justify-center">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" stroke-width="2"></rect></svg>
                </button>
                <!-- Circle Tool -->
                <button data-tool="circle" title="Circle" class="btn-tool px-2 h-full text-slate-700 hover:bg-slate-100 transition-colors flex items-center justify-center">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" stroke-width="2"></circle></svg>
                </button>
                <!-- Color Picker EyeDropper -->
                <button data-tool="eyedropper" title="Eyedropper" class="btn-tool px-2 h-full text-slate-700 hover:bg-slate-100 transition-colors flex items-center justify-center">
                    <span class="material-symbols-outlined text-lg leading-none">colorize</span>
                </button>
            </div>
        </div>

        <!-- Tool Property Controls (Anchored Right Side) -->
        <div class="flex items-center gap-4 ml-auto">
            <!-- Brush Style (Conditionally Visible) -->
            <div id="brush-style-container" class="flex items-center gap-1.5">
                <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Style</span>
                <select id="brush-style" class="bg-white border border-slate-300 text-xs text-slate-800 font-medium px-2 outline-none focus:border-slate-500 h-8">
                    <option value="round">Smooth Round</option>
                    <option value="square">Square Block</option>
                    <option value="highlighter">Highlighter (Soft)</option>
                </select>
            </div>

            <!-- Brush Size Number Input -->
            <div class="flex items-center gap-1.5">
                <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Size</span>
                <div class="flex items-center bg-white border border-slate-300 px-2 h-8">
                    <input id="brush-size-input" type="number" min="1" max="500" value="5" class="w-12 text-xs font-mono font-semibold text-slate-800 outline-none text-center h-full">
                    <span class="text-xs font-mono text-slate-500 ml-0.5">px</span>
                </div>
            </div>

            <!-- Color Selector -->
            <div class="flex items-center gap-2">
                <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Color</span>
                
                <!-- Main Color Selector Box -->
                <div class="flex items-center gap-1 bg-white border border-slate-300 p-1 h-8">
                    <input type="color" id="color-picker" value="#0f172a" class="w-6 h-full border-0 cursor-pointer p-0 bg-transparent">
                    <span id="color-hex" class="text-xs font-mono font-semibold text-slate-700 uppercase px-1">#0F172A</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Workspace Container -->
    <div id="workspace-container" class="flex-1 w-full h-full workspace-bg relative cursor-crosshair overflow-hidden flex items-center justify-center p-8">
        
        <!-- Canvas wrapper with shadow & background checkerboard -->
        <div id="canvas-wrapper" class="relative shadow-xl canvas-checkerboard border border-slate-300 bg-white origin-center">
            
            <!-- Main Drawing Canvas -->
            <canvas id="paint-canvas" class="block"></canvas>
            
            <!-- Dynamic Preview Overlay Canvas for drawing shapes / lines before commit -->
            <canvas id="preview-canvas" class="block absolute top-0 left-0 pointer-events-none"></canvas>
            
        </div>
        
    </div>

    <!-- Bottom Status Bar -->
    <footer class="bg-slate-200 border-t border-slate-300 px-5 py-1.5 text-xs text-slate-600 flex justify-between items-center z-40 flex-shrink-0">
        <div class="flex items-center gap-4">
            <span id="status-coords">X: 0px, Y: 0px</span>
            <span id="status-dimensions">Canvas: 1000 x 600px</span>
        </div>
    </footer>

    <!-- Overwrite Confirmation Modal -->
    <div id="modal-overwrite" class="fixed inset-0 z-50 hidden bg-slate-900/40 flex items-center justify-center p-4">
        <div class="bg-white border border-slate-300 p-6 w-full max-w-md text-slate-800 shadow-xl">
            <h2 class="text-base font-bold text-slate-900 mb-2">Clear Drawing Canvas?</h2>
            <p class="text-sm text-slate-600 mb-6">This action will erase your current drawing. Any unsaved edits will be lost permanently.</p>
            <div class="flex items-center justify-end gap-3">
                <button id="btn-cancel-clear" class="px-4 py-1.5 bg-slate-200 hover:bg-slate-300 text-slate-800 border border-slate-300 text-sm font-medium transition-colors">Cancel</button>
                <button id="btn-confirm-clear" class="px-4 py-1.5 bg-rose-600 hover:bg-rose-700 text-white text-sm font-medium transition-colors">Clear Canvas</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification Banner -->
    <div id="toast" class="fixed bottom-10 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-200 bg-slate-800 text-white px-4 py-2 text-sm flex items-center gap-2 shadow-md">
        <span id="toast-message">Notification</span>
    </div>

    <!-- Main Logic Script -->
    <script src="assets/js/paint.js"></script>
</body>
</html>
