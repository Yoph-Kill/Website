<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yoph Word</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Marked.js CDN for Markdown Import Parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" crossorigin="anonymous"></script>
    <!-- Turndown.js CDN for HTML to Markdown Conversion on Save -->
    <script src="https://unpkg.com/turndown/dist/turndown.js" crossorigin="anonymous"></script>
    <!-- Google Fonts Inter & JetBrains Mono -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/word.css">
<link rel="stylesheet" href="assets/css/yoph.css">
    <script src="assets/js/yoph.js" defer></script>
</head>
<body class="flex flex-col h-screen overflow-hidden">

    <!-- Header / Top Control Bar -->
    <header class="flex-shrink-0 bg-white border-b border-slate-300 px-4 py-2 flex items-center justify-between shadow-sm z-10">
        <div class="flex items-center gap-3">
            <input id="doc-title-input" type="text" value="Untitled Document" class="text-sm font-medium text-slate-700 bg-slate-100 hover:bg-slate-200 focus:bg-white border border-transparent focus:border-slate-300 px-2 py-1 outline-none transition-colors rounded-none">
        </div>

        <div class="flex items-center gap-2">
            <!-- Save Dropdown -->
            <div class="relative inline-block text-left">
                <button type="button" id="btn-save-dropdown" class="flex items-center gap-1.5 bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-3.5 py-1.5 transition-colors text-sm rounded-none">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
                    Save
                    <svg class="w-3.5 h-3.5 ml-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </button>
                <div id="save-menu" class="absolute right-0 mt-1 w-52 bg-white border border-slate-300 shadow-lg z-50 rounded-none hidden">
                    <button type="button" id="btn-save-yoph" class="w-full text-left px-4 py-2 text-sm text-slate-700 hover:bg-slate-100 flex items-center gap-2">
                        <span>Save .yophdoc</span>
                    </button>
                    <button type="button" id="btn-save-md" class="w-full text-left px-4 py-2 text-sm text-slate-700 hover:bg-slate-100 flex items-center gap-2 border-t border-slate-100">
                        <span>Save Markdown (.md)</span>
                    </button>
                </div>
            </div>

            <!-- Load Dropdown -->
            <div class="relative inline-block text-left">
                <button type="button" id="btn-load-dropdown" class="flex items-center gap-1.5 bg-slate-100 hover:bg-slate-300 text-slate-800 font-medium px-3.5 py-1.5 border border-slate-300 transition-colors text-sm rounded-none">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    Load
                    <svg class="w-3.5 h-3.5 ml-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </button>
                <div id="load-menu" class="absolute right-0 mt-1 w-52 bg-white border border-slate-300 shadow-lg z-50 rounded-none hidden">
                    <button type="button" id="btn-load-yoph" class="w-full text-left px-4 py-2 text-sm text-slate-700 hover:bg-slate-100 flex items-center gap-2">
                        <span>Load .yophdoc</span>
                    </button>
                    <button type="button" id="btn-load-md" class="w-full text-left px-4 py-2 text-sm text-slate-700 hover:bg-slate-100 flex items-center gap-2 border-t border-slate-100">
                        <span>Import Markdown / Text</span>
                    </button>
                </div>
            </div>
            <input type="file" id="file-input" class="hidden" accept=".md,.txt">
        </div>
    </header>

    <!-- Ribbon Formatting Bar -->
    <nav class="flex-shrink-0 bg-slate-100 border-b border-slate-300 px-4 py-2 flex items-center gap-1 overflow-x-auto select-none">
        <!-- Text Styling -->
        <div class="flex items-center h-8 bg-white border border-slate-300 rounded-none">
            <button type="button" id="fmt-bold" title="Bold (Ctrl+B)" class="h-8 px-3 text-slate-700 hover:bg-slate-100 font-bold flex items-center justify-center text-sm rounded-none border-r border-slate-200">B</button>
            <button type="button" id="fmt-italic" title="Italic (Ctrl+I)" class="h-8 px-3 text-slate-700 hover:bg-slate-100 italic flex items-center justify-center text-sm rounded-none border-r border-slate-200">I</button>
            <button type="button" id="fmt-strike" title="Strikethrough" class="h-8 px-3 text-slate-700 hover:bg-slate-100 line-through flex items-center justify-center text-sm rounded-none">S</button>
        </div>

        <div class="h-6 w-[1px] bg-slate-300 mx-1"></div>

        <!-- Headings & Text Types -->
        <div class="flex items-center h-8 bg-white border border-slate-300 rounded-none">
            <button type="button" id="fmt-p" title="Normal Paragraph" class="h-8 px-3 text-slate-700 hover:bg-slate-100 font-normal text-xs flex items-center justify-center rounded-none border-r border-slate-200">Paragraph</button>
            <button type="button" id="fmt-h1" title="Heading 1" class="h-8 px-3 text-slate-700 hover:bg-slate-100 font-bold text-xs flex items-center justify-center rounded-none border-r border-slate-200">H1</button>
            <button type="button" id="fmt-h2" title="Heading 2" class="h-8 px-3 text-slate-700 hover:bg-slate-100 font-semibold text-xs flex items-center justify-center rounded-none border-r border-slate-200">H2</button>
            <button type="button" id="fmt-h3" title="Heading 3" class="h-8 px-3 text-slate-700 hover:bg-slate-100 font-medium text-xs flex items-center justify-center rounded-none">H3</button>
        </div>

        <div class="h-6 w-[1px] bg-slate-300 mx-1"></div>

        <!-- Lists & Structure -->
        <div class="flex items-center h-8 bg-white border border-slate-300 rounded-none">
            <button type="button" id="fmt-ul" title="Unordered Bullet List" class="h-8 px-2.5 text-slate-700 hover:bg-slate-100 flex items-center justify-center rounded-none border-r border-slate-200">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16M2 6h.01M2 12h.01M2 18h.01"></path></svg>
            </button>
            <button type="button" id="fmt-ol" title="Numbered List" class="h-8 px-2.5 text-slate-700 hover:bg-slate-100 flex items-center justify-center rounded-none">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 6h14M7 12h14M7 18h14M3 6h1v4M3 12h2M3 18h2"></path></svg>
            </button>
        </div>

        <div class="h-6 w-[1px] bg-slate-300 mx-1"></div>

        <!-- Inserts -->
        <div class="flex items-center h-8 bg-white border border-slate-300 rounded-none">
            <button type="button" id="fmt-quote" title="Blockquote" class="h-8 px-2.5 text-slate-700 hover:bg-slate-100 flex items-center justify-center rounded-none border-r border-slate-200">
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M14.017 21v-7.391c0-5.704 3.731-9.57 8.983-10.609l.995 2.151c-2.432.917-3.995 3.638-3.995 5.849h4v10h-9.983zm-14.017 0v-7.391c0-5.704 3.748-9.57 9-10.609l.996 2.151c-2.433.917-3.996 3.638-3.996 5.849h3.983v10h-9.983z"></path></svg>
            </button>
            <button type="button" id="fmt-link" title="Insert Link" class="h-8 px-2.5 text-slate-700 hover:bg-slate-100 flex items-center justify-center rounded-none border-r border-slate-200">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
            </button>
            <button type="button" id="fmt-table" title="Insert Table" class="h-8 px-2.5 text-slate-700 hover:bg-slate-100 flex items-center justify-center rounded-none border-r border-slate-200">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M3 14h18M9 3v18M15 3v18M3 4a1 1 0 011-1h16a1 1 0 011 1v16a1 1 0 01-1 1H4a1 1 0 01-1-1V4z"></path></svg>
            </button>
            <button type="button" id="fmt-hr" title="Horizontal Line Divider" class="h-8 px-3 text-slate-700 hover:bg-slate-100 flex items-center justify-center font-bold text-xs rounded-none">—</button>
        </div>

        <div class="h-6 w-[1px] bg-slate-300 mx-1"></div>

        <!-- Table Formatting Controls -->
        <div id="table-toolbar" class="flex items-center h-8 bg-emerald-50 border border-emerald-300 rounded-none hidden">
            <button type="button" id="tbl-row-above" title="Insert Row Above Current Cell" class="h-8 px-2 text-xs font-medium text-emerald-800 hover:bg-emerald-100 flex items-center justify-center border-r border-emerald-200">+ Row Above ↑</button>
            <button type="button" id="tbl-row-below" title="Insert Row Below Current Cell" class="h-8 px-2 text-xs font-medium text-emerald-800 hover:bg-emerald-100 flex items-center justify-center border-r border-emerald-200">+ Row Below ↓</button>
            <button type="button" id="tbl-col-left" title="Insert Column to the Left" class="h-8 px-2 text-xs font-medium text-emerald-800 hover:bg-emerald-100 flex items-center justify-center border-r border-emerald-200">+ Col Left ←</button>
            <button type="button" id="tbl-col-right" title="Insert Column to the Right" class="h-8 px-2 text-xs font-medium text-emerald-800 hover:bg-emerald-100 flex items-center justify-center border-r border-emerald-200">+ Col Right →</button>
            <button type="button" id="tbl-del-row" title="Delete Active Row" class="h-8 px-2 text-xs font-medium text-rose-700 hover:bg-rose-100 flex items-center justify-center border-r border-emerald-200">Delete Row ✕</button>
            <button type="button" id="tbl-del-col" title="Delete Active Column" class="h-8 px-2 text-xs font-medium text-rose-700 hover:bg-rose-100 flex items-center justify-center border-r border-emerald-200">Delete Col ✕</button>
            <button type="button" id="tbl-del-table" title="Delete Entire Table" class="h-8 px-2 text-xs font-semibold text-rose-800 hover:bg-rose-200 flex items-center justify-center">Delete Entire Table 🗑</button>
        </div>
    </nav>

    <!-- Main Word Paper Workspace -->
    <main class="flex-1 overflow-y-auto p-6 md:p-12 flex justify-center bg-slate-300/70" id="workspace-viewport">
        <!-- Scale Wrapper for Page Display -->
        <div id="paper-wrapper" class="transition-transform origin-top flex flex-col items-center gap-8 pb-16">
            <!-- Pages rendered dynamically -->
        </div>
    </main>

    <!-- Status Bar -->
    <footer class="flex-shrink-0 bg-slate-200 border-t border-slate-300 px-5 py-1.5 flex items-center justify-between text-xs text-slate-600 select-none">
        <div class="flex items-center gap-4">
            <span id="stat-pages">Page 1 of 1</span>
            <span class="text-slate-300">|</span>
            <span id="stat-words">0 Words</span>
            <span class="text-slate-300">|</span>
            <span id="stat-chars">0 Characters</span>
        </div>
    </footer>

    <!-- Link Insertion Modal -->
    <div id="modal-link" class="fixed inset-0 z-50 bg-slate-900/40 flex items-center justify-center p-4 hidden">
        <div class="bg-white border border-slate-300 p-6 w-full max-w-md text-slate-800 shadow-lg rounded-none">
            <h2 class="text-base font-bold text-slate-900 mb-3">Insert Hyperlink</h2>
            <div class="space-y-3 mb-5">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Display Text</label>
                    <input id="input-link-text" type="text" placeholder="e.g. Visit Website" class="w-full border border-slate-300 px-3 py-1.5 text-sm outline-none focus:border-slate-500 rounded-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Target URL</label>
                    <input id="input-link-url" type="url" value="https://" placeholder="https://example.com" class="w-full border border-slate-300 px-3 py-1.5 text-sm outline-none focus:border-slate-500 rounded-none">
                </div>
            </div>
            <div class="flex items-center justify-end gap-3">
                <button type="button" id="btn-cancel-link" class="px-4 py-1.5 bg-slate-200 hover:bg-slate-300 text-slate-800 border border-slate-300 text-sm font-medium transition-colors rounded-none">Cancel</button>
                <button type="button" id="btn-confirm-link" class="px-4 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium transition-colors rounded-none">Insert Link</button>
            </div>
        </div>
    </div>

    <!-- Table Creation Modal -->
    <div id="modal-table" class="fixed inset-0 z-50 bg-slate-900/40 flex items-center justify-center p-4 hidden">
        <div class="bg-white border border-slate-300 p-6 w-full max-w-md text-slate-800 shadow-lg rounded-none">
            <h2 class="text-base font-bold text-slate-900 mb-3">Insert Table</h2>
            <div class="space-y-3 mb-5">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Number of Rows</label>
                    <input id="input-table-rows" type="number" min="1" max="50" value="2" class="w-full border border-slate-300 px-3 py-1.5 text-sm outline-none focus:border-slate-500 rounded-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Number of Columns</label>
                    <input id="input-table-cols" type="number" min="1" max="20" value="2" class="w-full border border-slate-300 px-3 py-1.5 text-sm outline-none focus:border-slate-500 rounded-none">
                </div>
            </div>
            <div class="flex items-center justify-end gap-3">
                <button type="button" id="btn-cancel-table" class="px-4 py-1.5 bg-slate-200 hover:bg-slate-300 text-slate-800 border border-slate-300 text-sm font-medium transition-colors rounded-none">Cancel</button>
                <button type="button" id="btn-confirm-table" class="px-4 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium transition-colors rounded-none">Create Table</button>
            </div>
        </div>
    </div>

    <!-- Overwrite Confirmation Modal -->
    <div id="modal-overwrite" class="fixed inset-0 z-50 bg-slate-900/40 flex items-center justify-center p-4 hidden">
        <div class="bg-white border border-slate-300 p-6 w-full max-w-md text-slate-800 shadow-lg rounded-none">
            <h2 class="text-base font-bold text-slate-900 mb-2">Discard Unsaved Changes?</h2>
            <p class="text-sm text-slate-600 mb-6">Opening or creating a new document will replace your current page content. Make sure you have saved your work first.</p>
            <div class="flex items-center justify-end gap-3">
                <button type="button" id="btn-cancel-modal" class="px-4 py-1.5 bg-slate-200 hover:bg-slate-300 text-slate-800 border border-slate-300 text-sm font-medium transition-colors rounded-none">Cancel</button>
                <button type="button" id="btn-confirm-modal" class="px-4 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium transition-colors rounded-none">Proceed</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-10 right-6 z-50 transform transition-all duration-200 bg-slate-800 text-white px-4 py-2.5 text-sm flex items-center gap-2 shadow-md rounded-none pointer-events-none translate-y-20 opacity-0">
        <span id="toast-message">Saved document</span>
    </div>

    <!-- Application Engine Script -->
    <script src="assets/js/word.js"></script>
</body>
</html>
