<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yoph AI</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Marked.js for Markdown Rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="assets/css/ai.css">
<link rel="stylesheet" href="assets/css/yoph.css">
    <script src="assets/js/yoph.js" defer></script>
</head>
<body class="yoph-ai w-screen h-screen flex flex-col bg-white text-slate-800">

    <!-- Main Chat Workspace (No top navigation bar per design specification) -->
    <main id="chat-container" class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-4">
        <!-- Dynamic chat bubbles will be rendered here -->
    </main>

    <!-- Bottom Input Container Area -->
    <footer class="bg-slate-200 border-t border-slate-300 p-3 sm:p-4 flex flex-col gap-2 flex-shrink-0 z-30">

        <!-- Pending Attachments Tray (Stacked vertically on bottom left above prompt entry) -->
        <div id="pending-attachments" class="hidden flex flex-col gap-2 max-w-sm">
            <!-- Dynamic pending attachments appear here -->
        </div>

        <!-- Main Input Toolbar Row -->
        <div class="flex items-center gap-2 w-full">
            <!-- Add File (+) Square Button -->
            <button id="btn-add-file" class="w-10 h-10 bg-slate-100 hover:bg-slate-300 active:bg-slate-400 text-slate-800 border border-slate-300 flex items-center justify-center font-bold text-lg transition-colors flex-shrink-0" title="Attach .yoph or .yophline file">
                +
            </button>
            <input type="file" id="file-input" accept=".yoph,.yophline" multiple class="hidden">

            <!-- Prompt Input Field (Single line high text input bar) -->
            <input type="text" id="prompt-input" placeholder="Ask Yoph AI or request a plan/timeline..." class="flex-1 h-10 bg-white border border-slate-300 px-3 py-1 text-sm text-slate-800 outline-none focus:border-slate-500">

            <!-- Clear Chat Button -->
            <button id="btn-clear-chat" class="px-3 h-10 bg-slate-100 hover:bg-slate-300 active:bg-slate-400 text-slate-700 border border-slate-300 text-xs font-semibold transition-colors flex-shrink-0" title="Clear Chat History">
                Clear
            </button>

            <!-- Send Button (Square green with ↑ arrow) -->
            <button id="btn-send" class="w-10 h-10 bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white border border-emerald-700 flex items-center justify-center text-lg font-bold transition-colors flex-shrink-0" title="Send Prompt">
                ↑
            </button>
        </div>
    </footer>

    <!-- Hidden File Input for Triggering Custom Downloads -->
    <a id="download-link" class="hidden"></a>

    <script src="assets/js/ai.js"></script>
</body>
</html>
