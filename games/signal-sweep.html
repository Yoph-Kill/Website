<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signal Sweep / Yoph Game</title><link rel="stylesheet" href="../styles.css"></head><body style="--glow:#59dfff;--hot:#ffab69;--acid:#e1ff79"><header class="sitebar wrap"><a class="brand" href="../index.html">yo<span>ph</span></a><span class="signal">game / signal sweep</span></header><main class="wrap"><section class="hero"><p class="eyebrow">playable fragment / 03</p><h1>Signal Sweep</h1><p class="lede">Find the moving bright point. Every successful sweep changes the geometry.</p><div class="panel"><canvas id="c" width="700" height="400"></canvas><div class="actions"><button class="btn" id="sound">play the sweep</button><p class="status" id="s">click the bright point</p></div></div></section></main><footer class="wrap"><a href="void-clicker.html">another strange game</a> · <a href="echo-drift.html">echo drift</a> · <a href="../pages/signal.html">signal room</a></footer><script>const c=document.querySelector('#c'),x=c.getContext('2d'),s=document.querySelector('#s'),audio=new Audio('../Website Assets/Music/c49712a6-eb8d-4ee0-87fa-8fc807ae936e.mp3');audio.preload='auto';let p={x:100,y:100},n=0;function draw(){x.fillStyle='#080914';x.fillRect(0,0,700,400);x.fillStyle='#e1ff79';x.shadowBlur=26;x.shadowColor='#e1ff79';x.beginPath();x.arc(p.x,p.y,12,0,7);x.fill();x.shadowBlur=0;x.fillStyle='#98a1c9';x.font='16px system-ui';x.fillText('sweeps: '+n,20,30)}c.onclick=e=>{if(Math.hypot(e.offsetX-p.x,e.offsetY-p.y)<35){n++;p={x:25+Math.random()*650,y:50+Math.random()*320};s.textContent='signal gathered / continue';draw()}else s.textContent='nearby, but not it'};document.querySelector('#sound').onclick=()=>{audio.currentTime=0;audio.play().catch(()=>{});s.textContent='the sweep made a sound'};draw();</script></body></html>
