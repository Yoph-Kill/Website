<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Echo Drift / Yoph Game</title><link rel="stylesheet" href="../styles.css"></head><body style="--glow:#8d7aff;--hot:#ff6eb4;--acid:#b6ff78"><header class="sitebar wrap"><a class="brand" href="../index.html">yo<span>ph</span></a><span class="signal">game / echo drift</span></header><main class="wrap"><section class="hero"><p class="eyebrow">playable fragment / 01</p><h1>Echo Drift</h1><p class="lede">Move the small signal through the larger signal. Collect the quiet points. The room will respond.</p></section><section class="game-shell"><div><canvas id="game" width="720" height="540" aria-label="Echo Drift game"></canvas><div class="actions"><button class="btn primary" id="start">begin drift</button><button class="btn" id="sound">play a collected echo</button></div></div><aside class="panel"><p class="eyebrow">readout</p><h3>score <span id="score">0</span></h3><p>Arrow keys or WASD move. The sound is an action, never a background.</p><p id="status" class="status">awaiting motion</p></aside></section></main><footer class="wrap"><a href="../pages/portal.html">leave through a portal</a> · <a href="../index.html">threshold</a></footer><script>
const c=document.querySelector('#game'),x=c.getContext('2d'),scoreEl=document.querySelector('#score'),statusEl=document.querySelector('#status');let running=false,score=0,player={x:360,y:270},orb={x:100,y:100},keys={};let audio=new Audio('../Website Assets/Music/9e51bd15-833e-4490-ae6f-adfabb02a505.mp3');audio.preload='auto';document.addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);document.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);document.querySelector('#start').onclick=()=>{running=true;score=0;player={x:360,y:270};statusEl.textContent='drifting';loop()};document.querySelector('#sound').onclick=()=>{audio.currentTime=0;audio.play().catch(()=>{});statusEl.textContent='echo released'};function loop(){if(!running)return;let dx=(keys.arrowright||keys.d?3:0)-(keys.arrowleft||keys.a?3:0),dy=(keys.arrowdown||keys.s?3:0)-(keys.arrowup||keys.w?3:0);player.x=Math.max(15,Math.min(705,player.x+dx));player.y=Math.max(15,Math.min(525,player.y+dy));if(Math.hypot(player.x-orb.x,player.y-orb.y)<20){score++;scoreEl.textContent=score;orb={x:25+Math.random()*670,y:25+Math.random()*490};statusEl.textContent='signal gathered'};x.fillStyle='#070811';x.fillRect(0,0,720,540);x.strokeStyle='rgba(141,122,255,.25)';for(let i=0;i<720;i+=40){x.beginPath();x.moveTo(i,0);x.lineTo(i,540);x.stroke()}for(let i=0;i<540;i+=40){x.beginPath();x.moveTo(0,i);x.lineTo(720,i);x.stroke()}x.fillStyle='#b6ff78';x.shadowBlur=22;x.shadowColor='#b6ff78';x.beginPath();x.arc(orb.x,orb.y,8,0,Math.PI*2);x.fill();x.fillStyle='#ff6eb4';x.shadowColor='#ff6eb4';x.beginPath();x.arc(player.x,player.y,13,0,Math.PI*2);x.fill();x.shadowBlur=0;requestAnimationFrame(loop)}
</script></body></html>
