<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Void Clicker / Yoph Game</title><link rel="stylesheet" href="../styles.css"></head><body style="--glow:#ff6e9d;--hot:#9d7aff;--acid:#d5ff78"><header class="sitebar wrap"><a class="brand" href="../index.html">yo<span>ph</span></a><span class="signal">game / void clicker</span></header><main class="wrap"><section class="hero"><p class="eyebrow">playable fragment / 02</p><h1>Void Clicker</h1><p class="lede">The void has a surface. Press it until the number becomes a different kind of number.</p><div class="panel" style="max-width:620px;text-align:center"><h2 id="count">0</h2><div class="actions" style="justify-content:center"><button class="btn primary" id="tap">press the surface</button><button class="btn" id="sound">play the void</button></div><p id="message" class="status">the surface is waiting</p><p class="eyebrow">sound is released only when requested</p></div></section></main><footer class="wrap"><a href="echo-drift.html">find another game</a> · <a href="signal-sweep.html">sweep the signal</a> · <a href="../pages/quiet-mode.html">quiet mode</a></footer><script>let n=0;const c=document.querySelector('#count'),m=document.querySelector('#message'),audio=new Audio('../Website Assets/Music/9f4128ac-3205-4709-9ec8-ecfceee3104a.mp3');audio.preload='auto';document.querySelector('#tap').onclick=()=>{n++;c.textContent=n;m.textContent=n%7===0?'the void noticed':'surface pressure registered'};document.querySelector('#sound').onclick=()=>{audio.currentTime=0;audio.play().catch(()=>{});m.textContent='the void made a noise'};</script></body></html>
