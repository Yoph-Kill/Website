<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yoph Timeline</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/timeline.css">
<link rel="stylesheet" href="assets/css/yoph.css">
    <script src="assets/js/yoph.js" defer></script>
</head>
<body class="w-screen h-screen relative bg-white text-slate-800 flex flex-col font-sans">

    <!-- Top Navigation Bar (Flat Minimalist Gray Bar) -->
    <header class="z-50 flex flex-wrap items-center justify-between gap-3 bg-slate-200 text-slate-800 px-5 py-2.5 border-b border-slate-300 flex-shrink-0">
        <!-- Editable Timeline Title -->
        <div class="flex items-center gap-2">
            <input id="timeline-title-input" type="text" value="Untitled Plan" placeholder="Timeline Title..."
                class="bg-white border border-slate-300 px-3 py-1.5 text-sm font-semibold text-slate-800 outline-none focus:border-slate-500 w-64 text-left">
        </div>

        <!-- Action Toolbar -->
        <div class="flex items-center gap-2 flex-wrap">
            <!-- Green Primary Button for New Event -->
            <button id="btn-add-event" class="flex items-center gap-1.5 bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-medium px-3.5 py-1.5 text-sm transition-colors border border-emerald-700">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                New Yoph Event
            </button>

            <!-- Green Primary Button for New Period -->
            <button id="btn-add-period" class="flex items-center gap-1.5 bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-medium px-3.5 py-1.5 text-sm transition-colors border border-emerald-700">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 00-2 2z"></path></svg>
                New Yoph Period
            </button>

            <div class="h-5 w-[1px] bg-slate-300 mx-1"></div>

            <!-- Zoom Controls -->
            <div class="flex items-center bg-white border border-slate-300">
                <button id="btn-zoom-out" title="Zoom Out Timeline" class="p-1.5 hover:bg-slate-100 text-slate-700 transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"></path></svg>
                </button>
                <span id="zoom-level" class="px-2.5 text-xs font-semibold text-slate-700 min-w-[55px] text-center">100%</span>
                <button id="btn-zoom-in" title="Zoom In Timeline" class="p-1.5 hover:bg-slate-100 text-slate-700 transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                </button>
                <button id="btn-reset-view" title="Jump to Today" class="px-2.5 py-1.5 text-xs font-medium text-slate-700 hover:bg-slate-100 transition-colors border-l border-slate-300">Today</button>
            </div>

            <div class="h-5 w-[1px] bg-slate-300 mx-1"></div>

            <!-- Save / Load .yophline -->
            <button id="btn-save" class="flex items-center gap-1.5 bg-slate-100 hover:bg-slate-300 text-slate-800 font-medium px-3.5 py-1.5 border border-slate-300 transition-colors text-sm">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                Save .yophline
            </button>
            <button id="btn-load" class="flex items-center gap-1.5 bg-slate-100 hover:bg-slate-300 text-slate-800 font-medium px-3.5 py-1.5 border border-slate-300 transition-colors text-sm">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                Load .yophline
            </button>
            <input type="file" id="file-input" accept=".yophline" class="hidden">
        </div>
    </header>

    <!-- Main View Area -->
    <div class="flex-1 flex flex-col relative overflow-hidden bg-slate-50">
        
        <!-- Time Axis Ruler Header -->
        <div id="timeline-ruler" class="w-full h-10 bg-slate-100 border-b border-slate-300 relative overflow-hidden select-none z-30 flex-shrink-0">
            <!-- Rendered dynamically -->
        </div>

        <!-- Canvas Workspace -->
        <div id="timeline-canvas" class="flex-1 w-full h-full timeline-grid relative cursor-grab overflow-hidden">
            <!-- Central Main Time Axis Line -->
            <div id="central-axis" class="absolute left-0 right-0 h-[2px] bg-slate-400 pointer-events-none z-10" style="top: 50%;"></div>
            
            <!-- Today Marker Line -->
            <div id="today-marker" class="absolute top-0 bottom-0 w-[2px] bg-red-500 z-20 pointer-events-none"></div>

            <!-- Items Workspace Layer -->
            <div id="items-layer" class="absolute inset-0 z-20 pointer-events-none"></div>
        </div>
    </div>

    <!-- Edit Modal for Event / Period -->
    <div id="modal-edit" class="fixed inset-0 z-50 hidden bg-slate-900/40 flex items-center justify-center p-4">
        <div class="bg-white border border-slate-300 p-6 w-full max-w-md text-slate-800 shadow-lg">
            <h2 id="edit-modal-title" class="text-base font-bold text-slate-900 mb-4">Edit Yoph Item</h2>
            
            <div class="space-y-4 text-sm">
                <!-- Title -->
                <div>
                    <label class="block font-medium text-slate-700 mb-1">Title</label>
                    <input type="text" id="edit-item-title" maxlength="60" class="w-full bg-slate-50 border border-slate-300 px-3 py-1.5 text-slate-800 outline-none focus:border-slate-500">
                </div>

                <!-- Start Date & Time -->
                <div>
                    <label id="edit-start-label" class="block font-medium text-slate-700 mb-1">Date & Time</label>
                    <input type="datetime-local" id="edit-item-start" class="w-full bg-slate-50 border border-slate-300 px-3 py-1.5 text-slate-800 outline-none focus:border-slate-500">
                </div>

                <!-- End Date & Time (Only for Periods) -->
                <div id="edit-end-container">
                    <label class="block font-medium text-slate-700 mb-1">End Date & Time</label>
                    <input type="datetime-local" id="edit-item-end" class="w-full bg-slate-50 border border-slate-300 px-3 py-1.5 text-slate-800 outline-none focus:border-slate-500">
                </div>

                <!-- Color Palette -->
                <div>
                    <label class="block font-medium text-slate-700 mb-1">Color Theme</label>
                    <div id="color-picker-group" class="flex items-center gap-3 pt-1">
                        <!-- Rendered dynamically -->
                    </div>
                </div>
            </div>

            <!-- Action buttons -->
            <div class="flex items-center justify-between gap-3 mt-6 pt-4 border-t border-slate-200">
                <button id="btn-delete-item" class="px-3.5 py-1.5 bg-red-600 hover:bg-red-700 text-white text-sm font-medium transition-colors">Delete Item</button>
                <div class="flex items-center gap-2">
                    <button id="btn-cancel-edit" class="px-3.5 py-1.5 bg-slate-200 hover:bg-slate-300 text-slate-800 border border-slate-300 text-sm font-medium transition-colors">Cancel</button>
                    <button id="btn-save-edit" class="px-3.5 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium transition-colors">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Overwrite Warning Modal -->
    <div id="modal-overwrite" class="fixed inset-0 z-50 hidden bg-slate-900/40 flex items-center justify-center p-4">
        <div class="bg-white border border-slate-300 p-6 w-full max-w-md text-slate-800 shadow-lg">
            <h2 class="text-base font-bold text-slate-900 mb-2">Overwrite Current Timeline?</h2>
            <p class="text-sm text-slate-600 mb-6">Loading a new .yophline file will replace all current events and periods. Unsaved changes will be lost.</p>
            <div class="flex items-center justify-end gap-3">
                <button id="btn-cancel-load" class="px-4 py-1.5 bg-slate-200 hover:bg-slate-300 text-slate-800 border border-slate-300 text-sm font-medium transition-colors">Cancel</button>
                <button id="btn-confirm-load" class="px-4 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium transition-colors">Proceed & Load</button>
            </div>
        </div>
    </div>

    <!-- Toast Banner -->
    <div id="toast" class="fixed bottom-4 right-4 z-50 transform translate-y-20 opacity-0 transition-all duration-200 bg-slate-800 text-white px-4 py-2 text-sm flex items-center gap-2">
        <span id="toast-message">Notification</span>
    </div>

    <!-- Main Application Logic -->
    <script src="assets/js/timeline.js"></script>
</body>
</html>
